{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css" />

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link
    rel="apple-touch-icon"
    sizes="180x180"
    href="{{ base_path }}/images/apple-touch-icon-180x180.png"
/>
<link
    rel="icon"
    type="image/svg+xml"
    href="{{ base_path }}/images/favicon.svg"
/>
<link
    rel="icon"
    type="image/png"
    href="{{ base_path }}/images/favicon-32x32.png"
    sizes="32x32"
/>
<link
    rel="icon"
    type="image/png"
    href="{{ base_path }}/images/favicon-192x192.png"
    sizes="192x192"
/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json" />
<link rel="icon" href="/images/favicon.ico" />
<meta name="theme-color" content="#ffffff" />

<!-- Custom CSS for Media page -->
<style>
    .youtube-video-container {
        margin: 2rem 0;
        padding: 1rem;
        background-color: #f8f9fa;
        border-radius: 8px;
        border-left: 4px solid #007bff;
    }

    .video-item {
        margin-bottom: 2rem;
    }

    .video-item h3 {
        color: #2c3e50;
        margin-bottom: 0.5rem;
        font-size: 1.4rem;
    }

    .video-item p {
        margin-bottom: 1rem;
        color: #6c757d;
    }

    .video-wrapper {
        position: relative;
        width: 100%;
        max-width: 560px;
        margin: 1rem 0;
    }

    .video-wrapper iframe {
        width: 100%;
        height: auto;
        aspect-ratio: 16/9;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .video-description {
        margin-top: 1rem;
        line-height: 1.6;
        color: #495057;
    }

    /* Responsive design */
    @media (max-width: 768px) {
        .video-wrapper {
            max-width: 100%;
        }

        .youtube-video-container {
            margin: 1rem 0;
            padding: 0.5rem;
        }
    }
</style>

<!-- end custom head snippets -->
